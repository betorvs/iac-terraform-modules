name: Terraform Module Releaser
on:
  pull_request:
    types: [opened, reopened, synchronize, closed] # Closed required
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.set-matrix.outputs.modules }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Required to accurately diff branches

      - name: Identify Changed Modules
        id: set-matrix
        run: |
          # Detect unique directories holding modified .tf files
          # Adjust the grep filter if your modules live inside a specific folder like 'modules/'
          CHANGED_DIRS=$(git diff --name-only ${{ github.event.before || github.event.pull_request.base.sha }} ${{ github.sha }} | grep -E '\.(tf|tftest\.hcl)$' | xargs -I {} dirname {} | grep -v 'tests$' | sort -u | jq -R -s -c 'split("\n")[:-1]')
          
          if [ "$CHANGED_DIRS" == "[]" ] || [ -z "$CHANGED_DIRS" ]; then
            echo "modules=[]" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "modules=$CHANGED_DIRS" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
  terraform-ci:
    runs-on: ubuntu-latest
    needs: ["detect-changes"]
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # 4.0.1
        with:
          terraform_version: "1.14.8"
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: "latest"
      - name: Initialize TFLint Configuration
        working-directory: ${{ matrix.module }}
        run: |
          tflint --init
      - name: Terraform Format Check
        working-directory: ${{ matrix.module }}
        run: terraform fmt -check -recursive
      - name: Validate Terraform Syntax
        working-directory: ${{ matrix.module }}
        run: |
          terraform init -backend=false
          terraform validate
      - name: Run TFLint Analysis
        working-directory: ${{ matrix.module }}
        run: tflint -f compact
  scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12.3114.0
        with:
          # This will add both a CLI output to the console and create a results.sarif file
          output_format: cli,sarif
          output_file_path: console,results.sarif
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        
        # Results are generated only on a success or failure
        # this is required since GitHub by default won't run the next step
        # when the previous one has failed. Security checks that do not pass will 'fail'.
        # An alternative is to add `continue-on-error: true` to the previous step
        # Or 'soft_fail: true' to checkov.
        if: success() || failure()
        with:
          sarif_file: results.sarif

  integration-tests:
    runs-on: ubuntu-latest
    needs: ["terraform-ci", "detect-changes"]
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # 4.0.1
        with:
          terraform_version: "1.14.8"
      - name: Start MiniStack (Fake AWS Cloud)
        run: docker run -d -p 4566:4566 ministackorg/ministack
      - name: Wait for MiniStack to be ready
        run: |
          echo 'Waiting for MiniStack...'
          for i in $(seq 1 10); do
            curl -s http://localhost:4566/_ministack/health && break
            sleep 2
          done
      - name: Terraform Test
        working-directory: ${{ matrix.module }}
        run: |
          pwd
          terraform init
          terraform test

  release:
    needs: ["terraform-ci"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Terraform Module Releaser
        uses: techpivot/terraform-module-releaser@f742e14f90a7d35f0ab230cce7db22169151aaeb # v2.1.0